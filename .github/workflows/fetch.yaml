# .github/workflows/sync-satellite-tles.yml
name: Sync Satellite TLEs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  update-tle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Fetch TLE data
        run: |
          curl -sL "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle" \
            > satellites.tle

      - name: Commit and push
        env:
          DEPLOY_TOKEN: ${{ secrets.DEPLOY_TOKEN }}
        run: |
          git add satellites.tle
          
          if ! git diff --staged --quiet; then
            git config --global user.email "bot@gmail.com"
            git config --global user.name "Bot"
            git commit -m "chore: update satellite TLEs [skip ci]"
            git push https://${{ secrets.DEPLOY_TOKEN }}@github.com/owner/repo.git master
          else
            echo "🚫 No changes detected, skipping push."
          fi
