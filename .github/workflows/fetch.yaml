name: Sync Satellite TLEs

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: Fetch TLE data
        run: |
          curl -sL "https://celestrak.org/NORAD/elements/gp.php?GROUP=active&FORMAT=tle" \
            > satellites.tle

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add satellites.tle
          
          if ! git diff --staged --quiet; then
            git commit -m "chore: update satellite TLEs [skip ci]"
            git push
          else
            echo "🚫 No changes detected, skipping push."
          fi
